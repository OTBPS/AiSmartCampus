server:
  port: ${SERVER_PORT:8000}

spring:
  config:
    import: optional:file:./application-local.yml
  application:
    name: smart-campus-navigation
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_campus_navigation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-at-least-32-bytes}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  ai:
    provider: ${AI_PROVIDER:mock}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:20}
  weather:
    qweather:
      api-key: ${QWEATHER_API_KEY:}
      base-url: ${QWEATHER_BASE_URL:https://nc2pg7kpbt.re.qweatherapi.com}
      timeout-seconds: ${QWEATHER_TIMEOUT_SECONDS:8}
  upload:
    root-dir: ${UPLOAD_ROOT_DIR:uploads}
    poi-dir: ${POI_UPLOAD_DIR:uploads/poi}
    discover-dir: ${DISCOVER_UPLOAD_DIR:uploads/discover}
